<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스르륵키스</title>

<style>
  :root {
    --player-color: #f8c007;
    --player-position-x: 50%;
    --player-position-y: 40px;
    --player-translateX: -50%;
    --text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* 배경 영상 래퍼 */
  #videoWrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  .bg-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .bg-video.active {
    opacity: 1;
  }

  /* 플레이어 */
  .player {
    position: absolute;
    bottom: var(--player-position-y);
    left: var(--player-position-x);
    transform: translateX(var(--player-translateX));
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: sans-serif;
    color: var(--player-color);
    text-shadow: var(--text-shadow);
    z-index: 10;
  }

  /* 곡 리스트 */
  .song-list {
    position: absolute;
    top: 20px;
    left: 20px;
    color: var(--player-color);
    text-shadow: var(--text-shadow);
    font-family: sans-serif;
    z-index: 10;
  }

  .song {
    cursor: pointer;
    margin-bottom: 5px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .song.active {
    opacity: 1;
    font-weight: bold;
  }

  /* 아이콘 버튼 */
  .icon-btn {
    background: none;
    border: none;
    color: var(--player-color);
    cursor: pointer;
    padding: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, opacity 0.2s ease;
    filter: drop-shadow(var(--text-shadow));
  }

  .icon-btn svg {
    fill: var(--player-color);
    width: 18px;
    height: 18px;
  }

  .icon-btn:hover {
    opacity: 0.8;
  }

  .icon-btn:active {
    transform: scale(0.9);
  }

  /* 진행 바 */
  .progress {
    width: 240px;
    height: 4px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    transition: width 0.3s ease;
  }

  .progress-bar {
    height: 100%;
    background: var(--player-color);
    width: 0%;
    border-radius: 2px;
    box-shadow: var(--text-shadow);
  }

  /* 볼륨 */
  .volume-container {
    display: flex;
    align-items: center;
    position: relative;
  }

  .volume-slider-wrapper {
    width: 0;
    overflow: hidden;
    transition: width 0.3s ease;
    display: flex;
    align-items: center;
  }

  .volume-slider {
    width: 80px;
    height: 4px;
    margin: 0 8px 0 0;
    cursor: pointer;
    accent-color: var(--player-color);
  }

  .volume-container:hover .volume-slider-wrapper {
    width: 88px;
  }

  .volume-container:hover ~ .progress,
  .player:has(.volume-container:hover) .progress {
    width: 152px;
  }
</style>
</head>

<body>

  <!-- 배경 영상 (두 개로 크로스페이드) -->
  <div id="videoWrapper">
    <video id="bgVideo1" class="bg-video active" muted playsinline></video>
    <video id="bgVideo2" class="bg-video" muted playsinline></video>
  </div>

  <div class="song-list">
    <div class="song" data-src="http://a.tumblr.com/tumblr_qi43caGPC91yr33tko1.mp3">스르륵키스</div>
    <div class="song" data-src="https://blog.kakaocdn.net/dn/cEF7M0/btsoZcok0i1/J4GQ9ktarBuQl0Ghch11g1/tfile.mp3">줄리아</div>
    <div class="song" data-src="https://64.media.tumblr.com/8982e00cd32aba328ba9d1503aba0fce/4ba07def4a24e2ad-e8/9185271973fe372eb8eb77e60a65de09a57ab31c.mp3">당신은 모르실거야</div>
  </div>

  <div class="player">
    <button id="playPause" class="icon-btn">▶</button>
    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>

    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="volume-container">
      <div class="volume-slider-wrapper">
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.4">
      </div>
      <button class="icon-btn volume-btn" aria-label="Volume">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
    </div>
  </div>

  <audio id="audio"></audio>

<script>
  // ========== 오디오 플레이어 ==========
  const audio = document.getElementById('audio');
  const playPause = document.getElementById('playPause');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const volumeSlider = document.getElementById('volumeSlider');
  const songs = document.querySelectorAll('.song');

  let currentSong = 0;
  audio.volume = 0.4;

  function loadSong(index) {
    songs.forEach(s => s.classList.remove('active'));
    songs[index].classList.add('active');
    audio.src = songs[index].dataset.src;
    audio.load();
  }

  loadSong(currentSong);

  playPause.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playPause.textContent = '⏸';
    } else {
      audio.pause();
      playPause.textContent = '▶';
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationEl.textContent = formatTime(audio.duration);
    }
  });

  progress.addEventListener('click', (e) => {
    if (!isNaN(audio.duration)) {
      const ratio = e.offsetX / progress.clientWidth;
      audio.currentTime = ratio * audio.duration;
    }
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value;
  });

  songs.forEach((song, index) => {
    song.addEventListener('click', () => {
      currentSong = index;
      loadSong(index);
      audio.play();
      playPause.textContent = '⏸';
    });
  });

  audio.addEventListener('ended', () => {
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
    audio.play();
    playPause.textContent = '⏸';
  });

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // ========== 배경 영상 크로스페이드 ==========
  const video1 = document.getElementById('bgVideo1');
  const video2 = document.getElementById('bgVideo2');

  const playlist = [
    "https://usanonki.github.io/photo/sunshine.mp4",
    "https://usanonki.github.io/photo/ulsan.mp4",
    "https://usanonki.github.io/photo/oldhouse.mp4"
  ];

  let currentIndex = 0;
  let activeVideo = video1;
  let inactiveVideo = video2;

  // 첫 영상 시작
  activeVideo.src = playlist[0];
  activeVideo.play().catch(() => {});

  function playNext() {
    const nextIndex = (currentIndex + 1) % playlist.length;

    // 비활성 영상에 다음 영상 미리 로드
    inactiveVideo.src = playlist[nextIndex];
    inactiveVideo.load();

    inactiveVideo.oncanplay = () => {
      // 페이드 전환
      activeVideo.classList.remove('active');
      inactiveVideo.classList.add('active');

      inactiveVideo.play().catch(() => {});

      // 역할 교체
      [activeVideo, inactiveVideo] = [inactiveVideo, activeVideo];
      currentIndex = nextIndex;

      // 이벤트 한 번만 실행되도록 제거
      inactiveVideo.oncanplay = null;
    };
  }

  // 현재 재생 중인 영상이 끝나면 다음으로
  video1.addEventListener('ended', playNext);
  video2.addEventListener('ended', playNext);
</script>

</body>
</html>
