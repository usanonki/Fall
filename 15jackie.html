<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재키신청곡 - usadisk 고정버전</title>
<style>
  :root {
    --player-color: #ffcf40;
    --text-shadow:
    -1px -1px 0 rgba(10,25,10,0.9), 1px -1px 0 rgba(10,25,10,0.9),
    -1px 1px 0 rgba(10,25,10,0.9), 1px 1px 0 rgba(10,25,10,0.9),
     0px 2px 6px rgba(0,0,0,0.8);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
  }
  /* ★ 배경을 body가 아니라 별도 레이어로 - 비율 영향 안 받게 */
  #bg {
    position: fixed; inset: 0;
    background: url('https://usanonki.github.io/photo/guitar.png') center/cover no-repeat;
    /* usadisk 미리보기에서 잘리는 것 방지: 항상 1280x720 비율로 강제 */
    z-index: 1;
  }

  /* ★ 핵심 수정: px 대신 %로 고정 */
 .song-list {
    position: fixed; /* absolute -> fixed */
    top: 4%; left: 2.5%; /* 180px, 20px -> %로 */
    z-index: 10;
    color: var(--player-color);
    text-shadow: var(--text-shadow);
    font-family: sans-serif;
    font-size: 16px;
    line-height: 1.8;
  }
 .song { cursor: pointer; opacity: 0.7; }
 .song.active { opacity: 1; font-weight: bold; }

  /* 플레이어도 %로 */
 .player {
    position: fixed;
    bottom: 4%; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    color: var(--player-color); text-shadow: var(--text-shadow);
    z-index: 10;
    white-space: nowrap;
  }
 .icon-btn { background: none; border: none; color: var(--player-color); cursor: pointer; display: flex; }
 .icon-btn svg { fill: var(--player-color); width: 18px; height: 18px; }
 .progress { width: 22vw; min-width: 180px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; }
 .progress-bar { height: 100%; background: var(--player-color); width: 0%; }
 .volume-container { display: flex; align-items: center; }
 .volume-slider-wrapper { width: 0; overflow: hidden; transition: width 0.3s ease; }
 .volume-container:hover.volume-slider-wrapper { width: 88px; }
 .volume-slider { width: 80px; height: 4px; accent-color: var(--player-color); }

  /* ★ usadisk 축소 미리보기(작은 iframe) 대응 */
  @media (max-width: 800px) {
   .song-list { font-size: 14px; top: 3%; left: 3%; }
   .player { bottom: 3%; font-size: 12px; }
   .progress { width: 35vw; }
  }
</style>
</head>
<body>
<div id="bg"></div>

<div class="song-list">
  <div class="song" data-src="https://usanonki.github.io/music/Luna_Rossas.mp3">Luna Rossas</div>
  <div class="song" data-src="https://usanonki.github.io/music/Maria_Elena.mp3">Maria Elena</div>
  <div class="song" data-src="https://usanonki.github.io/music/Love.mp3">Love</div>
  <div class="song" data-src="https://usanonki.github.io/music/TTR.mp3">Try to remember</div>
  <div class="song" data-src="https://usanonki.github.io/music/TLP.mp3">Quien sera</div>
</div>

<div class="player">
  <button id="playPause" class="icon-btn">▶</button>
  <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="volume-container">
    <div class="volume-slider-wrapper"><input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.4"></div>
    <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
  </div>
</div>
<audio id="audio"></audio>
<script>
const audio = document.getElementById('audio');
const playPause = document.getElementById('playPause');
const progress = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');
const currentTime = document.getElementById('currentTime');
const duration = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const songs = document.querySelectorAll('.song');
let currentSong = 0;
audio.volume = 0.4;
function loadSong(index) {
  songs.forEach(s => s.classList.remove('active'));
  songs[index].classList.add('active');
  audio.src = songs[index].dataset.src;
  audio.load();
}
loadSong(currentSong);
playPause.addEventListener('click', () => {
  if (audio.paused) { audio.play(); playPause.textContent = '⏸'; }
  else { audio.pause(); playPause.textContent = '▶'; }
});
audio.addEventListener('timeupdate', () => {
  if (!isNaN(audio.duration)) {
    progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTime.textContent = formatTime(audio.currentTime);
    duration.textContent = formatTime(audio.duration);
  }
});
progress.addEventListener('click', (e) => {
  if (!isNaN(audio.duration)) audio.currentTime = (e.offsetX / progress.clientWidth) * audio.duration;
});
volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
songs.forEach((song, index) => {
  song.addEventListener('click', () => { currentSong = index; loadSong(index); audio.play(); playPause.textContent = '⏸'; });
});
audio.addEventListener('ended', () => { currentSong = (currentSong + 1) % songs.length; loadSong(currentSong); audio.play(); playPause.textContent = '⏸'; });
function formatTime(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${s < 10? '0' : ''}${s}`; }
</script>
</body>
</html>
