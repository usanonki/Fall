<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>단무지 신청곡</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: url('https://usanonki.github.io/photo/jk.png') no-repeat center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
  }
  h1 { margin-bottom: 8px; }
  .track-list {
    list-style: none;
    padding: 0;
    margin: 0;
    line-height: 1.2;
    text-align: center;
  }
  .track-list li {
    margin: 2px 0;
    cursor: pointer;
    transition: color 0.3s, font-weight 0.3s;
  }
  .track-list li:hover { color: #90caf9; }
  .track-list li.active {
    color: #ffeb3b;
    font-weight: bold;
  }
  audio {
    width: 320px;
    height: 25px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>🎵 JK`s(단무지) Playlist</h1>

<ul class="track-list" id="trackList">
  <li>그사람</li>
  <li>목마른 소녀</li>
  <li>님이오는 소리</li>
  <li>벌써 일년</li>
</ul>

<audio id="musicPlayer" controls></audio>

<script>
const playlist = [
  { title: "그사람", url: "https://usanonki.github.io/music/그사람.mp3" },
  { title: "목마른 소녀", url: "https://usanonki.github.io/music/목마른소녀.mp3" },
  { title: "님이오는 소리", url: "https://usanonki.github.io/music/님이오는소리.mp3" },
  { title: "벌써 일년", url: "https://usanonki.github.io/music/벌써일년.mp3" }
];

const player = document.getElementById("musicPlayer");
const items = document.querySelectorAll("#trackList li");
let index = 0;

// 곡 재생
function play(i) {
  index = i;
  player.src = playlist[i].url;
  player.play();
  items.forEach((li, n) => li.classList.toggle("active", n === i));
}

// 리스트 클릭
items.forEach((li, i) => li.onclick = () => play(i));

// 자동 다음 곡
player.onended = () => play((index + 1) % playlist.length);

// 초기 설정
player.volume = 0.35;
play(0);
</script>

</body>
</html>
