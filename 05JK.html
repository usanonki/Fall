<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>단무지 신청곡</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: url('https://usanonki.github.io/Image/jk.png') 
                no-repeat center center;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: sans-serif;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
  }
  h1 {
    margin-bottom: 8px;
  }
  .track-list {
    list-style: none;
    padding: 0;
    margin: 0;
    line-height: 1.2;
    text-align: center;
  }
  .track-list li {
    margin: 2px 0;
    cursor: pointer;
    transition: color 0.3s, font-weight 0.3s;
  }
  .track-list li:hover {
    color: #90caf9;
  }
  .track-list li.active {
    color: #ffeb3b;
    font-weight: bold;
  }
  audio {
    width: 320px;
    height: 25px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>🎵 JK`s(단무지) Playlist</h1>
<ul class="track-list" id="trackList">
  <li>그사람</li>
  <li>목마른 소녀</li>
  <li>님이오는 소리</li>
  <li>벌써 일년</li>
</ul>

<audio id="musicPlayer" controls></audio>

<script>
// 곡 목록 (제목 + URL)
const playlist = [
  { title: "그사람", url: "https://usanonki.github.io/music/그사람.mp3" },
  { title: "목마른 소녀", url: "https://usanonki.github.io/music/목마른소녀.mp3" },
  { title: "님이오는 소리", url: "https://usanonki.github.io/music/님이오는소리.mp3" },
  { title: "벌써 일년", url: "https://usanonki.github.io/music/벌써일년.mp3" }
];

let currentIndex = 0;
const player = document.getElementById("musicPlayer");
const trackListItems = document.querySelectorAll("#trackList li");

// 곡 재생 함수
function playTrack(index) {
  currentIndex = index;
  player.src = playlist[index].url;
  player.play();
  updateActiveTrack(index);
}

// 현재 재생 곡 하이라이트
function updateActiveTrack(index) {
  trackListItems.forEach((item, i) => {
    item.classList.toggle("active", i === index);
  });
}

// 곡 클릭 시 해당 곡 재생
trackListItems.forEach((item, index) => {
  item.addEventListener("click", () => {
    playTrack(index);
  });
});

// 곡이 끝나면 다음 곡 재생 (무한 반복)
player.addEventListener("ended", () => {
  currentIndex = (currentIndex + 1) % playlist.length;
  playTrack(currentIndex);
});

// 첫 곡 재생 시작
playTrack(currentIndex);
</script>

</body>
</html>
